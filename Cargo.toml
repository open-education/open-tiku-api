[package]
name = "open-tiku-api"
version = "0.1.0"
edition = "2024"

[profile.release]
# 自动从二进制文件去除符号信息
strip = true
# Cargo 发布模式默认优化级别为 3, 这会优化二进制文件的执行速度
# 要指示 Cargo 针对二进制大小进行优化, 请在 Cargo.toml 使用 z 优化级别
opt-level = 'z'
# 默认情况下, Cargo 指示编译单元进行单独编译和优化
# LTO指示链接器在 link 阶段进行优化
# 例如, 这可以删除无用代码, 并且通常可以减小二进制大小
lto = true
# 默认情况下, Cargo 为发布版本指定 16 个并行代码生成单元
# 这缩短了编译时间, 但会阻止某些优化
# Cargo.toml 中将其设置为 1 以允许最大尺寸缩减优化
codegen-units = 1
# 当程序发生 panic 时，直接停止运行，而不是尝试“栈展开”（unwinding）, 一般来说不需要除非能确定不会发生内存泄漏
panic = "abort"

[dependencies]
actix-web = "4"
serde = { version = "1.0", features = ["derive"] }
actix-multipart = "0.6"
futures-util = "0.3"
chrono = { version = "0.4.42", features = ["serde"] }
sanitize-filename = "0.6.0"
tokio = { version = "1.48.0", features = [
    "rt-multi-thread", # 多线程运行时，Actix-Web 必需
    "macros", # 提供 #[tokio::main] 宏
    "net", # 提供 TCP/UDP 网络支持，Actix-Web 底层依赖
    "time", # 提供异步定时功能，可能被部分库间接依赖
    "fs", # 如果用到异步文件 I/O（如读取配置文件）
    "sync", # 提供 Mutex、RwLock 等同步原语，用于共享状态
] }
md5 = "0.8.0"
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio-rustls", "chrono", "json", "rust_decimal"] }
rust_decimal = "1.39.0"
regex = "1.12.2"
pulldown-cmark = "0.13.4"
reqwest = { version = "0.13.4", features = ["json", "query"] }
serde_json = "1.0.150"
idgen_rs = "0.2.0"
uuid = { version = "1.23.4", features = ["v4"] }
sha2 = "0.11.0"
base64 = "0.23.0"
url = "2.5.8"
argon2 = "0.5.3"
rand = "0.10.2"
lettre = { version = "0.11", features = ["tokio1-native-tls", "builder"] }
config = { version = "0.15.25", features = ["toml"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-actix-web = "0.7.22"
tracing-appender = "0.2.5"
